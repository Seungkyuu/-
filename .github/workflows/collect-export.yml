name: 나라장터 입찰공고 수집 → 엑셀 출력

on:
  # 수동 실행 (연도 선택 가능)
  workflow_dispatch:
    inputs:
      years:
        description: '수집 연도 (쉼표 구분, 예: 2023,2024,2025)'
        required: false
        default: '2025'

  # 매일 오전 7시 자동 실행 (KST = UTC+9)
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = KST 07:00

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 데이터 수집 및 엑셀 생성
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: |
          YEARS="${{ github.event.inputs.years || '2025' }}"
          echo "수집 대상 연도: $YEARS"
          node scripts/collect-export.mjs $( echo "$YEARS" | tr ',' ' ' )

      - name: 결과 엑셀 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 나라장터_입찰공고_${{ github.event.inputs.years || '2025' }}
          path: output/*.xlsx
          retention-days: 30

      - name: 수집 결과 요약 출력
        run: |
          echo "## 수집 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 내용 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 대상 연도 | ${{ github.event.inputs.years || '2025' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 시각 | $(date '+%Y-%m-%d %H:%M:%S KST' --date='+9 hours') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Actions 탭 → 이 워크플로 → Artifacts 에서 엑셀 파일 다운로드**" >> $GITHUB_STEP_SUMMARY
