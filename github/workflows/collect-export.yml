name: 나라장터 입찰공고 수집 → 엑셀 출력

on:
  workflow_dispatch:
    inputs:
      years:
        description: '수집 연도 (쉼표 구분, 예: 2023,2024,2025)'
        required: false
        default: '2025'
  schedule:
    - cron: '0 22 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: 데이터 수집 및 엑셀 생성
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: |
          YEARS="${{ github.event.inputs.years || '2025' }}"
          node scripts/collect-export.mjs $( echo "$YEARS" | tr ',' ' ' )
      - uses: actions/upload-artifact@v4
        with:
          name: 나라장터_입찰공고_${{ github.event.inputs.years || '2025' }}
          path: output/*.xlsx
          retention-days: 30
